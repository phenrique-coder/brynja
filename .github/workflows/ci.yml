name: Brynja CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails-check:
    name: Guardrails & Secrets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure no .env files are committed
        run: |
          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env($|\.(local|production|development)$)' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "ERROR: .env files must never be committed:"
            echo "$TRACKED_ENV"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mandatory SafeProbe & Ownership Guardrails tests
        run: pnpm vitest run src/server/__tests__/safe-probe-policy.spec.ts src/server/__tests__/guardrails-and-certificates.spec.ts src/server/__tests__/safe-probes.spec.ts

  server-core:
    name: Server Core & Safe Probes Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Server Core test suite
        run: pnpm vitest run src/server/__tests__

  frontend-build:
    name: UI Tests, Typecheck & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Full Test Suite
        run: pnpm test

      - name: Production Build (Vercel-ready)
        run: pnpm build
