services:
  postgres:
    image: postgres:16-alpine
    container_name: veredito-sec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veredito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veredito_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-veredito_sec}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - veredito_sec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veredito} -d ${POSTGRES_DB:-veredito_sec}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veredito_sec_pgdata:
